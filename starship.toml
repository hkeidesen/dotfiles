# --- global ---
add_newline = true
command_timeout = 2000
# Filesystem-scan budget — default 30ms blows up in large repos
# (e.g. stemne/frontend with ~290k files), causing "Scanning current
# directory timed out" warnings and broken prompt renders.
scan_timeout = 1000
right_format = ""                # robbyrussell is left-only

# ----- prompt layout -----
# This MUST stay above the first [table] header. A bare key written after one
# belongs to that table, not the root — this line lived below [palettes.melange]
# and was parsed as palettes.melange.format, so starship ignored it and fell
# back to its default prompt. Every module configured below was either unused
# or rendered in an order nobody chose.
#
# Only modules listed here render, so a new [module] section needs a line here.
format = """\
$directory\
$git_branch\
$git_commit\
$git_status\
$git_state\
${env_var.GH_AUTH_USER}\
$python\
$nodejs\
$golang\
$docker_context\
$kubernetes\
$cmd_duration\
$jobs\
$line_break\
$character"""

# --- palette (optional, safe to keep) ---
palette = "melange"
[palettes.melange]
fg     = "#e6d3a3"
muted  = "#8a8a8a"
accent = "#a7c080"
blue   = "#7fbbb3"
orange = "#e39b7b"
yellow = "#d3c28e"
red    = "#e68183"
purple = "#d699b6"
bg     = "#1e1e1e"

# ----- directory: show just the current folder -----
[directory]
truncation_length = 1
truncate_to_repo = false
style = "bold fg:blue"                 # cyan/blueish dir like robbyrussell
format = "[$path]($style) "

# ----- git: 'git:(branch)' -----
[git_branch]
symbol = ""                             # we'll print 'git:' ourselves
style = "fg:red"                        # robbyrussell-ish branch color
format = "[git:](fg:blue)[($branch)]($style) "

# Optional: show tag on detached HEAD
[git_commit]
only_detached = true
tag_disabled = false
style = "fg:purple"
format = "[( $tag )]($style)"

# Dirty mark + ahead/behind compact like robbyrussell
[git_status]
style = "fg:red"
conflicted = "!"
untracked = "?"
stashed = "S"
staged = "+"
modified = "*"
renamed = "»"
deleted = "x"
# Divergence from upstream is information, not damage — keep it out of the red
# that marks a dirty tree, so "⇣7" stops reading like something is wrong.
ahead = "[ ⇡${count}](fg:muted)"
behind = "[ ⇣${count}](fg:muted)"
diverged = "[ ⇕${ahead_count}/${behind_count}](fg:orange)"
# no brackets, just append marks if present
format = "[$modified$staged$deleted$conflicted$untracked$stashed$ahead_behind]($style) "

[git_state]
style = "fg:orange"
format = "([$state( $progress_current/$progress_total)]($style)) "

# ----- GitHub account selected for this shell -----
[env_var.GH_AUTH_USER]
format = "[gh:$env_value]($style) "
style = "fg:muted"

# ----- runtimes (kept minimal) -----
[python]
symbol = " "
style = "fg:yellow"
detect_extensions = ["py"]
detect_files = ["pyproject.toml","requirements.txt","Pipfile","manage.py"]
format = "[$symbol($virtualenv )]($style)"

[nodejs]
symbol = " "
style = "fg:accent"
detect_files = ["package.json","pnpm-lock.yaml","bun.lockb","tsconfig.json"]
format = "[$symbol($version )]($style)"

[golang]
symbol = " "
style = "fg:accent"
format = "[$symbol($version )]($style)"

[docker_context]
symbol = " "
style = "fg:blue"
only_with_files = true   # otherwise "colima" prints in every directory, everywhere
format = "[$symbol$context]($style) "

[gcloud]
disabled = true

[kubernetes]
symbol = "☸ "
style = "fg:purple"
disabled = false
detect_env_vars = ["KUBECONFIG","STARSHIP_KUBECONTEXT"]
format = '[$symbol($context\($namespace\))]($style) '
contexts = [
  { context_pattern = "prod.*",    style = "bold fg:red",    context_alias = "prod" },
  { context_pattern = "staging.*", style = "bold fg:orange", context_alias = "stg"  },
  { context_pattern = "dev.*",     style = "fg:accent",      context_alias = "dev"  },
]

# ----- character: show yellow ✗ only on failure -----
[character]
success_symbol = "[❯](bold fg:accent) "
error_symbol   = "[✗](fg:yellow) "
vicmd_symbol   = "[❮](bold fg:orange) "
format = "$symbol"

# ----- command duration and background jobs -----
[cmd_duration]
min_time = 3000
format = "took [$duration]($style) "
style = "fg:yellow"

[jobs]
number_threshold = 1
format = "[jobs:$number]($style) "
style = "fg:muted"
